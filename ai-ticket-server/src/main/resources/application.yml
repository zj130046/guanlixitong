server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: ai-ticket-server
  profiles:
    active: dev
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ai_ticket?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

sa-token:
  token-name: Authorization
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: true

app:
  ai:
    provider: deepseek            # mock | deepseek | dashscope
    embedding-provider: dashscope # mock | dashscope（deepseek 无 embedding API）
    system-prompt: 你是一个智能客服助手，需要礼貌、专业、简洁地回答用户问题。如果遇到无法解答的问题，请引导用户转人工客服。
    stream-timeout-seconds: 120
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}   # 只写 host，勿带 /v1（completions-path 单独配）
      completions-path: /v1/chat/completions
      chat-model: deepseek-chat
      temperature: 0.7
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}
      base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com}
      chat-model: qwen-plus
      embed-model: text-embedding-v2
  faq:
    similarity-threshold: 0.72
    semantic-search-enabled: true
