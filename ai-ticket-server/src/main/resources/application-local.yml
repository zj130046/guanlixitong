# 本地开发环境（H2 内存数据库，无需安装 MySQL）
spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:ai_ticket;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:sql/schema-h2.sql
      data-locations: classpath:sql/seed-h2.sql
      continue-on-error: true
  h2:
    console:
      enabled: true
      path: /h2-console

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

logging:
  level:
    com.aics.ticket: DEBUG
    org.springframework.web: INFO
